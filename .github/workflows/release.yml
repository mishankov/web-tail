name: release

on:
  push:
    tags:
      - "v*"

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: check out code
        uses: actions/checkout@v7

      - name: set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: build client
        working-directory: ./client
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run build

      - name: set up go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'

      - name: run goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GORELEASER_GITHUB_TOKEN }}
